<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dressable-g9 s15 browser gate (task-134122)</title>
<style>
  html, body { margin: 0; background: #2b2b2b; color: #eee; font: 13px monospace; }
  #gate { position: absolute; left: 8px; top: 8px; white-space: pre; background: rgba(0,0,0,.55); padding: 6px 8px; max-width: 880px; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "./three/three.module.js" } }
</script>
</head>
<body>
<pre id="gate">BROWSER_GATE RUNNING</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './three/jsm/loaders/GLTFLoader.js';
import { FoundrySecondaryMotion, profileFromGltf } from './secondary_motion.js';

const q = new URLSearchParams(location.search);
const GLB = q.get('glb') || 'character.glb';
const FRAMES = 120, DT = 1 / 60;
const out = document.getElementById('gate');
const W = 900, H = 1100;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b2b);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 3, 3); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 50);

function fail(msg) { out.textContent = 'BROWSER_GATE FAIL ' + msg; document.title = 'FAIL'; window.__gate = { pass: false, msg }; }

try {
  const gltf = await new GLTFLoader().loadAsync(GLB);
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  const profile = profileFromGltf(gltf);
  if (!profile) throw new Error('no asset.extras.foundry.secondary_motion in GLB');
  const garments = [];
  root.traverse((o) => { if (o.isSkinnedMesh && /dressable[ _](pants|shirt)/i.test(o.name)) garments.push(o); });
  if (garments.length < 2) throw new Error('garment skinned meshes found: ' + garments.map((g) => g.name).join(','));
  const bodies = [];
  root.traverse((o) => { if (o.isSkinnedMesh && /^Genesis9(_\d+)?$/.test(o.name)) bodies.push(o); });
  const springNames = new Set(profile.chains.flatMap((c) => c.bones));
  // garment vertices that carry any spring-bone weight
  const tracked = [];
  for (const g of garments) {
    const sk = g.geometry.attributes.skinIndex, sw = g.geometry.attributes.skinWeight;
    const boneNames = g.skeleton.bones.map((b) => b.name);
    const bb = bodies.length ? bodies[0].skeleton.bones : [];
    // one skin: the garment's joints are the SAME Bone objects that drive the body
    const sameSkel = bb.length > 0 && bb.every((b) => g.skeleton.bones.includes(b)) &&
      boneNames.some((n) => springNames.has(n));
    g.userData.sameSkel = !!sameSkel;
    for (let i = 0; i < sk.count; i += 1) {
      let w = 0;
      for (let k = 0; k < 4; k += 1) if (springNames.has(boneNames[sk.getComponent(i, k)])) w += sw.getComponent(i, k);
      if (w > 0.3) tracked.push({ g, i, rest: g.getVertexPosition(i, new THREE.Vector3()).applyMatrix4(g.matrixWorld) });
    }
  }
  if (!tracked.length) throw new Error('no garment vertex carries spring-bone weight');
  const springs = new FoundrySecondaryMotion(THREE, root, profile);
  const terminal = profile.chains.map((c) => root.getObjectByName(c.bones[c.bones.length - 1]));
  const restQ = terminal.map((b) => b.quaternion.clone());
  let maxSway = 0, finite = true;
  const perChain = {};
  for (let f = 0; f < FRAMES; f += 1) {
    springs.update(DT, f * DT);
    root.updateMatrixWorld(true);
  }
  const p = new THREE.Vector3();
  for (const t of tracked) {
    t.g.getVertexPosition(t.i, p).applyMatrix4(t.g.matrixWorld);
    const d = p.distanceTo(t.rest);
    if (!Number.isFinite(d)) finite = false;
    maxSway = Math.max(maxSway, d);
    const key = t.g.name;
    perChain[key] = Math.max(perChain[key] || 0, d);
  }
  const qDelta = terminal.map((b, k) => 1 - Math.abs(restQ[k].dot(b.quaternion)));
  // frame the whole character
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const dist = s.y * parseFloat(q.get('d') || '2.05');
  const yaw = parseFloat(q.get('yaw') || '0') * Math.PI / 180;
  camera.position.set(c.x + Math.sin(yaw) * dist, c.y, c.z + Math.cos(yaw) * dist);
  camera.lookAt(c);
  renderer.render(scene, camera);
  const pass = finite && maxSway > 0.001 && garments.every((g) => g.userData.sameSkel) && qDelta.every((x) => x > 1e-8);
  const res = {
    pass, three: THREE.REVISION, glb: GLB, frames: FRAMES, dt: DT,
    garments: garments.map((g) => ({ name: g.name, vertices: g.geometry.attributes.position.count, joints: g.skeleton.bones.length })),
    chains: profile.chains.map((c) => c.id), tracked_vertices: tracked.length,
    max_garment_sway_mm: +(maxSway * 1000).toFixed(2),
    per_garment_max_sway_mm: Object.fromEntries(Object.entries(perChain).map(([k, v]) => [k, +(v * 1000).toFixed(2)])),
    terminal_bone_quat_delta: qDelta.map((x) => +x.toExponential(3)),
    fan: profile.fan,
  };
  window.__gate = res;
  out.textContent = `BROWSER_GATE ${pass ? 'PASS' : 'FAIL'} · three r${THREE.REVISION} · ${garments.length} G9 garments on one skin · ` +
    `${profile.chains.length} spring chains · ${FRAMES}-frame fan sim · max garment sway ${res.max_garment_sway_mm} mm\n` +
    JSON.stringify(res);
  document.title = pass ? 'PASS' : 'FAIL';
} catch (e) {
  fail(String(e && e.stack || e));
}
</script>
</body>
</html>
